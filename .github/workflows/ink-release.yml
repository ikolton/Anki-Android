# Builds signed "AnkiDroid Ink" APKs: the ink branch on top of the newest stable AnkiDroid release.
# The merge happens only inside the job (GITHUB_TOKEN may not push upstream workflow changes),
# so the ink branch stays on its original base and every run merges it afresh.
name: Ink release

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if this release already exists"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency: ink-release

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ink
          fetch-depth: 0

      - name: Merge ink into the newest stable release
        id: base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags https://github.com/ankidroid/Anki-Android.git '+refs/tags/v*:refs/tags/v*'
          ink=$(git rev-parse HEAD)
          latest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "latest=$latest ink=$ink"

          # release N of an upstream version: always one more than the last, so the phone accepts it
          last=$(gh release list --limit 200 --json tagName -q '.[].tagName' | sed -n "s/^$latest-ink\.\([0-9]*\)$/\1/p" | sort -n | tail -1)
          if [ -n "$last" ] && [ "$(git rev-list -n 1 "$latest-ink.$last" 2>/dev/null)" = "$ink" ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "$latest-ink.$last already built from $ink"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(( ${last:-0} + 1 ))
          [ "$n" -le 99 ] || { echo "inkBuild would exceed 99 for $latest"; exit 1; }

          # a merge only needs ink's net change to apply, so old ink commits never conflict again
          git checkout -q --detach "$latest"
          if ! git merge -q --no-edit "$ink"; then
            files=$(git diff --name-only --diff-filter=U)
            git merge --abort
            title="Ink: konflikt przy przejściu na $latest"
            if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[].number')" ]; then
              printf 'Zmiany z gałęzi ink nie łączą się czysto z %s. Pliki w konflikcie:\n\n%s\n\nPoproś Claudea o dostosowanie gałęzi ink do %s. Do tego czasu działa poprzednia wersja.\n' \
                "$latest" "$files" "$latest" > issue.md
              gh issue create --title "$title" --body-file issue.md
            fi
            exit 1
          fi
          {
            echo "latest=$latest"
            echo "ink=$ink"
            echo "n=$n"
            echo "tag=$latest-ink.$n"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.base.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.base.outputs.skip != 'true'

      - name: Build signed APKs
        if: steps.base.outputs.skip != 'true'
        env:
          KEYSTOREPWD: ${{ secrets.KEYSTOREPWD }}
          KEYPWD: ${{ secrets.KEYPWD }}
          KEYALIAS: ${{ secrets.KEYALIAS }}
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ink.jks"
          export KEYSTOREPATH="$RUNNER_TEMP/ink.jks"
          ./gradlew :AnkiDroid:assembleFullRelease -Duniversal-apk=true \
            -PcustomSuffix=ink -PcustomName="AnkiDroid Ink" -PinkBuild=${{ steps.base.outputs.n }}

      - name: Publish release
        if: steps.base.outputs.skip != 'true'
        run: |
          tag=${{ steps.base.outputs.tag }}
          latest=${{ steps.base.outputs.latest }}
          out=AnkiDroid/build/outputs/apk/full/release
          ls "$out"
          cp "$out"/*arm64-v8a*.apk "AnkiDroid-Ink-$tag-arm64-v8a.apk"
          cp "$out"/*universal*.apk "AnkiDroid-Ink-$tag-universal.apk"
          {
            echo "AnkiDroid $latest z wyglądem ink & saffron (gałąź ink ${{ steps.base.outputs.ink }} scalona z $latest)."
            echo
            echo "Zmiany względem AnkiDroid:"
            git log --no-merges --format='- %s' "$latest"..HEAD
          } > notes.md
          gh release create "$tag" --target "${{ steps.base.outputs.ink }}" --title "AnkiDroid Ink $tag" --notes-file notes.md \
            "AnkiDroid-Ink-$tag-arm64-v8a.apk" "AnkiDroid-Ink-$tag-universal.apk"
